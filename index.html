

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Lab</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
    <script src="app.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8f9fa;
            color: #202124;
            font-family: Arial, sans-serif;
        }

        header {
            height: 58px;
            padding: 0 22px;
            background: white;
            border-bottom: 1px solid #dadce0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 19px;
            font-weight: 500;
        }

        #status, #save-status {
            font-size: 12px;
            color: #188038;
        }

        main {
            max-width: 1050px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            border: 1px solid #dadce0;
            background: white;
            color: #3c4043;
            border-radius: 5px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #f1f3f4;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #add-cell {
            color: #1967d2;
            border-color: #c6dafc;
        }

        .cell {
            display: flex;
            margin-bottom: 12px;
            border: 1px solid #dadce0;
            border-radius: 7px;
            background: white;
            overflow: hidden;
        }

        .cell-number {
            width: 48px;
            flex-shrink: 0;
            padding: 13px 5px;
            text-align: center;
            color: #70757a;
            font-family: monospace;
            font-size: 12px;
            border-right: 1px solid #eee;
        }

        .cell-content {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
        }

        .cell-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .cell-header strong {
            font-size: 11px;
            font-weight: normal;
            color: #70757a;
        }

       
.cell:focus-within {
    border-color: #8ab4f8;
}

.cell textarea {
    display: block;
    width: 100%;
    min-height: 65px;
    height: auto;
    resize: none;
    overflow: hidden;
    border: none;
    outline: none;
    padding: 8px;
    background: #f8f9fa;
    color: #202124;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
}

.cell textarea:focus {
    background: #f1f3f4;
}

.output {
    margin: 8px 0 0;
    padding: 9px 8px;
    border-top: 1px solid #eee;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: monospace;
    font-size: 13px;
    color: #202124;
}

.output[hidden] {
    display: none;
}

        .cell textarea:focus {
            background: #f1f3f4;
        }

        .run-button {
            color: #188038;
        }

        .delete-button {
            color: #d93025;
        }

        .output-label {
            margin: 9px 0 4px;
            font-size: 10px;
            color: #70757a;
        }

        .output {
            margin: 0;
            padding: 5px 8px;
            min-height: 20px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: monospace;
            font-size: 13px;
            color: #202124;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 12px;
            }

            main {
                padding: 0 8px;
            }

            .cell-number {
                width: 34px;
            }

            .cell-content {
                padding: 6px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Python Lab</h1>

        <div>
            <span id="status">Loading Python...</span>
            <span id="save-status"> | Loading notebook...</span>
        </div>
    </header>

    <main>

        <div class="toolbar">
            <button id="add-cell">+ Code</button>
        </div>

        <div id="notebook"></div>

    </main>

</body>
</html>
